name: Deploy

# push 到 main 自動部署到 Cloudflare Workers（部署前先跑測試＋型檢把關）。
on:
  push:
    branches: [main]
  workflow_dispatch: # 允許在 Actions 頁面手動觸發

# 同一時間只跑一個部署；新 push 取消進行中的舊部署。
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # wrangler 需要 Node ≥22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check (app + worker)
        run: |
          npx tsc --noEmit
          npm run typecheck:worker

      - name: Build
        run: npm run build

      # 用官方 action 部署：它在 runner 上乾淨安裝對應平台的 wrangler，
      # 避免 npm ci 在 Linux 上缺 macOS 產生之 lockfile 的平台專屬二進位（workerd-linux-64）。
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.106.0'
